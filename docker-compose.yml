version: '3'
services:
  pingoo:
    container_name: pingoo
    image: pingoo:latest
    ports:
      - "5004:5004"
    volumes:
      - ./templates:/templates
      - ./public:/public
      - ./.env:/.env
      - ./docs:/docs
      - ./logs:/logs
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    networks:
      - postgres_default

networks:
  postgres_default:
    external: true
